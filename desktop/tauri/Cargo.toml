[package]
name = "plutus-vision"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Plutus Vision Pine IDE — native desktop shell (Tauri v2 + system webkit2gtk)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Lean release: small binary, low RSS, fast-enough build. lto off keeps peak
# build memory low (this host runs under memory pressure).
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
